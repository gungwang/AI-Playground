<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Flight & Fight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        #eagle {
            position: absolute;
            width: 100px;
            height: 80px;
            font-size: 80px;
            z-index: 10;
            transition: transform 0.1s;
        }

        .enemy {
            position: absolute;
            font-size: 60px;
            z-index: 5;
        }

        .projectile {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #FFD700;
            border-radius: 50%;
            z-index: 8;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: moveClouds 20s linear infinite;
        }

        @keyframes moveClouds {
            from { left: -200px; }
            to { left: 1000px; }
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 18px;
        }

        #health-bar-container {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4b4b, #ff6b6b);
            transition: width 0.3s;
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
            color: white;
        }

        #game-over h2 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #restart-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        #restart-btn:hover {
            background: #45a049;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 50;
        }

        .control-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 15px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 50;
            text-align: center;
        }

        .hit-effect {
            animation: hitEffect 0.3s ease-out;
        }

        @keyframes hitEffect {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- UI Layer -->
        <div id="ui-layer">
            <div class="stat-box">
                <div>Score: <span id="score">0</span></div>
            </div>
            <div class="stat-box">
                <div>High Score: <span id="high-score">0</span></div>
            </div>
            <div class="stat-box">
                <div>Health</div>
                <div id="health-bar-container">
                    <div id="health-bar"></div>
                </div>
            </div>
        </div>

        <!-- Instructions -->
        <div id="instructions">
            🕹️ WASD/Arrows to Move | SPACE to Attack | Click to Shoot
        </div>

        <!-- Eagle -->
        <div id="eagle">🦅</div>

        <!-- Controls -->
        <div id="controls">
            <button class="control-btn" id="left-btn">⬅️</button>
            <button class="control-btn" id="right-btn">➡️</button>
            <button class="control-btn" id="attack-btn">⚔️</button>
            <button class="control-btn" id="shoot-btn">🎯</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>

        <!-- Clouds will be generated dynamically -->
    </div>

    <script>
        // Game State
        const gameState = {
            score: 0,
            highScore: 0,
            health: 100,
            isPlaying: true,
            eagle: {
                x: 400,
                y: 300,
                width: 100,
                height: 80
            },
            enemies: [],
            projectiles: [],
            clouds: [],
            lastEnemyTime: 0,
            lastCloudTime: 0,
            keys: {}
        };

        // DOM Elements
        const eagleEl = document.getElementById('eagle');
        const gameContainer = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const healthBar = document.getElementById('health-bar');
        const gameOverEl = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // Control buttons
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const attackBtn = document.getElementById('attack-btn');
        const shootBtn = document.getElementById('shoot-btn');

        // Generate Clouds
        function generateClouds() {
            for (let i = 0; i < 10; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.width = (Math.random() * 150 + 100) + 'px';
                cloud.style.height = (Math.random() * 80 + 50) + 'px';
                cloud.style.top = Math.random() * 300 + 'px';
                cloud.style.left = '-200px';
                cloud.style.animationDuration = (Math.random() * 20 + 15) + 's';
                gameContainer.appendChild(cloud);
                gameState.clouds.push(cloud);
            }
        }

        // Spawn Enemy
        function spawnEnemy() {
            const enemyTypes = ['🦅', '🦊', '🐺', '🐻'];
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.style.fontSize = (Math.random() * 50 + 50) + 'px';
            enemy.textContent = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
            enemy.style.left = (Math.random() * 750) + 'px';
            enemy.style.top = (Math.random() * 300) + 'px';
            gameContainer.appendChild(enemy);
            gameState.enemies.push({
                el: enemy,
                x: parseFloat(enemy.style.left),
                y: parseFloat(enemy.style.top),
                width: 60,
                height: 60,
                hp: 3
            });
        }

        // Shoot Projectile
        function shoot() {
            const projectile = document.createElement('div');
            projectile.className = 'projectile';
            projectile.style.left = (gameState.eagle.x + 50) + 'px';
            projectile.style.top = (gameState.eagle.y + 40) + 'px';
            gameContainer.appendChild(projectile);
            gameState.projectiles.push({
                el: projectile,
                x: gameState.eagle.x + 50,
                y: gameState.eagle.y + 40,
                speed: 10,
                width: 20,
                height: 20
            });
        }

        // Attack Effect
        function attack() {
            const eagle = document.getElementById('eagle');
            eagle.style.transform = 'scale(1.3)';
            setTimeout(() => {
                eagle.style.transform = 'scale(1)';
            }, 100);
        }

        // Check Collision
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // Update Game
        function update() {
            if (!gameState.isPlaying) return;

            // Move Eagle
            if (gameState.keys['ArrowLeft'] || gameState.keys['a'] || gameState.keys['A']) {
                gameState.eagle.x = Math.max(50, gameState.eagle.x - 5);
            }
            if (gameState.keys['ArrowRight'] || gameState.keys['d'] || gameState.keys['D']) {
                gameState.eagle.x = Math.min(750, gameState.eagle.x + 5);
            }
            eagleEl.style.left = gameState.eagle.x + 'px';
            eagleEl.style.top = gameState.eagle.y + 'px';

            // Move Projectiles
            gameState.projectiles.forEach((proj, i) => {
                proj.x += proj.speed;
                proj.el.style.left = proj.x + 'px';

                // Check collision with enemies
                gameState.enemies.forEach((enemy, j) => {
                    if (checkCollision(proj, enemy)) {
                        enemy.hp--;
                        proj.el.remove();
                        gameState.projectiles.splice(i, 1);
                        if (enemy.hp <= 0) {
                            enemy.el.remove();
                            gameState.enemies.splice(j, 1);
                            gameState.score += 10;
                            scoreEl.textContent = gameState.score;
                        }
                    }
                });

                // Remove off-screen projectiles
                if (proj.x > 800) {
                    proj.el.remove();
                    gameState.projectiles.splice(i, 1);
                }
            });

            // Move Enemies
            gameState.enemies.forEach((enemy, i) => {
                enemy.y += 2;
                enemy.el.style.top = enemy.y + 'px';

                // Check collision with eagle
                if (checkCollision({ x: gameState.eagle.x, y: gameState.eagle.y, width: 100, height: 80 }, enemy)) {
                    gameState.health -= 10;
                    healthBar.style.width = gameState.health + '%';
                    enemy.el.remove();
                    gameState.enemies.splice(i, 1);
                }

                // Remove off-screen enemies
                if (enemy.y > 600) {
                    enemy.el.remove();
                    gameState.enemies.splice(i, 1);
                }
            });

            // Spawn enemies and clouds
            if (Date.now() - gameState.lastEnemyTime > 2000) {
                spawnEnemy();
                gameState.lastEnemyTime = Date.now();
            }
            if (Date.now() - gameState.lastCloudTime > 3000) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.width = (Math.random() * 150 + 100) + 'px';
                cloud.style.height = (Math.random() * 80 + 50) + 'px';
                cloud.style.top = Math.random() * 300 + 'px';
                cloud.style.left = '-200px';
                cloud.style.animationDuration = (Math.random() * 20 + 15) + 's';
                gameContainer.appendChild(cloud);
                gameState.clouds.push(cloud);
                gameState.lastCloudTime = Date.now();
            }

            // Check Game Over
            if (gameState.health <= 0) {
                endGame();
            }
        }

        // End Game
        function endGame() {
            gameState.isPlaying = false;
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                highScoreEl.textContent = gameState.highScore;
            }
            finalScoreEl.textContent = gameState.score;
            gameOverEl.style.display = 'flex';
        }

        // Restart Game
        function restartGame() {
            // Clear all elements
            gameState.enemies.forEach(e => e.el.remove());
            gameState.projectiles.forEach(p => p.el.remove());
            gameState.clouds.forEach(c => c.remove());

            // Reset state
            gameState.score = 0;
            gameState.health = 100;
            gameState.eagle.x = 400;
            gameState.eagle.y = 300;
            gameState.enemies = [];
            gameState.projectiles = [];
            gameState.clouds = [];
            gameState.isPlaying = true;

            // Reset UI
            scoreEl.textContent = '0';
            healthBar.style.width = '100%';
            gameOverEl.style.display = 'none';

            // Clear and regenerate clouds
            gameState.clouds.forEach(c => c.remove());
            generateClouds();
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            gameState.keys[e.key] = true;
            if (e.code === 'Space') {
                shoot();
                attack();
            }
        });

        window.addEventListener('keyup', (e) => {
            gameState.keys[e.key] = false;
        });

        // Click to shoot
        gameContainer.addEventListener('click', (e) => {
            if (gameState.isPlaying) {
                shoot();
                attack();
            }
        });

        // Button event listeners
        leftBtn.addEventListener('mousedown', () => {
            gameState.keys['ArrowLeft'] = true;
        });
        leftBtn.addEventListener('mouseup', () => {
            gameState.keys['ArrowLeft'] = false;
        });
        leftBtn.addEventListener('mouseleave', () => {
            gameState.keys['ArrowLeft'] = false;
        });

        rightBtn.addEventListener('mousedown', () => {
            gameState.keys['ArrowRight'] = true;
        });
        rightBtn.addEventListener('mouseup', () => {
            gameState.keys['ArrowRight'] = false;
        });
        rightBtn.addEventListener('mouseleave', () => {
            gameState.keys['ArrowRight'] = false;
        });

        attackBtn.addEventListener('mousedown', () => {
            if (gameState.isPlaying) {
                attack();
            }
        });
        attackBtn.addEventListener('mouseup', () => {
            // No action needed for attack
        });

        shootBtn.addEventListener('mousedown', () => {
            if (gameState.isPlaying) {
                shoot();
            }
        });
        shootBtn.addEventListener('mouseup', () => {
            // No action needed for shoot
        });

        restartBtn.addEventListener('click', restartGame);

        // Game Loop
        function gameLoop() {
            update();
            requestAnimationFrame(gameLoop);
        }

        // Start Game
        function startGame() {
            // Clear existing elements
            gameState.enemies.forEach(e => e.el.remove());
            gameState.projectiles.forEach(p => p.el.remove());
            
            // Generate initial clouds
            generateClouds();
            
            // Initialize eagle
            eagleEl.style.left = gameState.eagle.x + 'px';
            eagleEl.style.top = gameState.eagle.y + 'px';

            // Reset state
            gameState.score = 0;
            gameState.health = 100;
            gameState.isPlaying = true;
            
            // Update UI
            scoreEl.textContent = '0';
            healthBar.style.width = '100%';
            gameOverEl.style.display = 'none';

            // Start loop
            gameLoop();
        }

        // Initialize on page load
        window.addEventListener('load', startGame);
    </script>
</body>
</html>
